org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 opt-outs so KSP (Room) + kotlin-android keep working
android.builtInKotlin=false
android.newDsl=false

# ---- Rowan config ----
# GitHub repo (owner/name) the in-app update checker looks at for the latest release
rowan.githubRepo=olliestrain/rowan
# Default hub address (Raspberry Pi, hostname "rowan")
rowan.hubUrl=http://mosaic.local:8787
